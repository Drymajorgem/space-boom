<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter: Evolution Core</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: monospace;
            background-color: #040408;
            color: #00f0ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .game-wrapper {
            background: #090914;
            border: 2px solid #ff007f;
            border-radius: 8px;
            padding: 10px;
            width: 820px;
            max-width: 100%;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            background: #000;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #333;
        }
        .slot-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }
        .slot {
            background: #111;
            border: 1px solid #333;
            padding: 5px;
            text-align: center;
            font-size: 11px;
            color: #777;
        }
        .slot.active {
            background: #0055ff;
            color: #fff;
            border-color: #00f0ff;
        }
        canvas {
            background: #000000;
            display: block;
            margin: 0 auto;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="hud">
            <div>SCORE: <span id="uiScore" style="color:#ffaa00;">0</span></div>
            <div>HULL: <span id="uiHp" style="color:#fff;">150/150</span></div>
            <div>GUN: <span id="uiGun" style="color:#39ff14;">BLASTER (LVL 1)</span></div>
        </div>

        <div class="slot-bar">
            <div class="slot active" id="s1">1: BLASTER <span id="lvl1">[LVL 1]</span></div>
            <div class="slot" id="s2">2: DUAL-LASER <span id="lvl2">[LVL 1]</span></div>
            <div class="slot" id="s3">3: FLAK SPREAD <span id="lvl3">[LVL 1]</span></div>
            <div class="slot" id="s4">4: PLASMA RAIL <span id="lvl4">[LVL 1]</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiScore = document.getElementById('uiScore');
    const uiHp = document.getElementById('uiHp');
    const uiGun = document.getElementById('uiGun');
    
    const slots = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3'), document.getElementById('s4')];
    const lvlTexts = [document.getElementById('lvl1'), document.getElementById('lvl2'), document.getElementById('lvl3'), document.getElementById('lvl4')];

    let score = 0;
    let gameOver = false;
    let enemySpawnCounter = 0;

    const mouse = { x: 0, y: 0 };
    const keys = { w: false, a: false, s: false, d: false };

    let player = { 
        x: 400, y: 225, size: 12, speed: 5.2, angle: 0, hp: 150, maxHp: 150, 
        gun: 1, gunName: "BLASTER",
        gunLevels: new Int32Array([1, 1, 1, 1]) 
    };

    const MAX_BULLETS = 64;
    const bullets = new Float32Array(MAX_BULLETS * 6); 
    
    const MAX_ENEMIES = 32;
    const enemies = new Float32Array(MAX_ENEMIES * 4); 

    // Pre-allocated items drop container matrix [active, x, y, type, life]
    const MAX_ITEMS = 8;
    const items = new Float32Array(MAX_ITEMS * 5);

    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
        
        if (['1', '2', '3', '4'].includes(e.key)) {
            let choice = parseInt(e.key);
            slots[player.gun - 1].classList.remove('active');
            player.gun = choice;
            slots[player.gun - 1].classList.add('active');
            updateHudText();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
        mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
    });

    canvas.addEventListener('mousedown', () => {
        if (gameOver) { resetGame(); return; }
        allocateBullet();
    });

    function updateHudText() {
        const gNames = ["BLASTER", "DUAL-LASER", "FLAK SPREAD", "PLASMA RAIL"];
        player.gunName = gNames[player.gun - 1];
        uiGun.innerText = `${player.gunName} (LVL ${player.gunLevels[player.gun - 1]})`;
        uiHp.innerText = `${player.hp}/${player.maxHp}`;
    }

    function allocateBullet() {
        let count = 0;
        const cos = Math.cos(player.angle);
        const sin = Math.sin(player.angle);
        const currentLvl = player.gunLevels[player.gun - 1];

        let baseModes = player.gun === 1 ? 1 : player.gun === 2 ? 2 : player.gun === 3 ? 3 : 1;
        let totalProjectiles = baseModes + (currentLvl - 1);

        for (let i = 0; i < MAX_BULLETS; i++) {
            let idx = i * 6;
            if (bullets[idx] === 0) {
                bullets[idx] = 1; 
                bullets[idx + 1] = player.x;
                bullets[idx + 2] = player.y;
                
                let speedFactor = player.gun === 4 ? 18 : 13;
                let offset = (count - (totalProjectiles - 1) / 2) * 0.14;
                
                bullets[idx + 3] = Math.cos(player.angle + offset) * speedFactor;
                bullets[idx + 4] = Math.sin(player.angle + offset) * speedFactor;
                bullets[idx + 5] = player.gun; 

                count++;
                if (count >= totalProjectiles) break;
            }
        }
    }

    function poolEnemySpawner() {
        for (let i = 0; i < MAX_ENEMIES; i++) {
            let idx = i * 4;
            if (enemies[idx] === 0) {
                enemies[idx] = 1; 
                enemies[idx + 1] = Math.random() < 0.5 ? -15 : canvas.width + 15;
                enemies[idx + 2] = Math.random() * canvas.height;
                // Harder speed: 1.45 standard base multiplier
                enemies[idx + 3] = 1.45 + (score * 0.0006); 
                break;
            }
        }
    }

    function dropLootItem(x, y) {
        let rand = Math.random();
        let itemType = 0; 
        
        if (rand < 0.35) {
            itemType = 1; // 35% chance to drop Upgrade Core [UPG]
        } else if (rand >= 0.35 && rand < 0.50) {
            itemType = 2; // 15% chance to drop Health Pack [HP]
        } else {
            return; // No drop configuration
        }

        for (let i = 0; i < MAX_ITEMS; i++) {
            let idx = i * 5;
            if (items[idx] === 0) {
                items[idx] = 1; // active flag
                items[idx + 1] = x;
                items[idx + 2] = y;
                items[idx + 3] = itemType;
                items[idx + 4] = 450; // frames lifespan
                break;
            }
        }
    }

    function gameTick() {
        if (gameOver) return;

        if (keys.w && player.y > player.size) player.y -= player.speed;
        if (keys.s && player.y < canvas.height - player.size) player.y += player.speed;
        if (keys.a && player.x > player.size) player.x -= player.speed;
        if (keys.d && player.x < canvas.width - player.size) player.x += player.speed;

        player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

        enemySpawnCounter++;
        if (enemySpawnCounter >= Math.max(16, 32 - (score * 0.02))) {
            poolEnemySpawner();
            enemySpawnCounter = 0;
        }

        // Process Drops
        for (let i = 0; i < MAX_ITEMS; i++) {
            let idx = i * 5;
            if (items[idx] === 1) {
                items[idx + 4]--;
                if (items[idx + 4] <= 0) items[idx] = 0;

                let dx = player.x - items[idx + 1];
                let dy = player.y - items[idx + 2];
                if ((dx < 0 ? -dx : dx) < 16 && (dy < 0 ? -dy : dy) < 16) {
                    if (items[idx + 3] === 1) {
                        // AUTOMATIC UPGRADE PACK COLLECTED Matrix Hook
                        player.gunLevels[player.gun - 1]++;
                        lvlTexts[player.gun - 1].innerText = `[LVL ${player.gunLevels[player.gun - 1]}]`;
                    } else if (items[idx + 3] === 2) {
                        player.hp = Math.min(player.maxHp, player.hp + 20);
                    }
                    items[idx] = 0;
                    updateHudText();
                }
            }
        }

        for (let i = 0; i < MAX_BULLETS; i++) {
            let idx = i * 6;
            if (bullets[idx] === 1) {
                bullets[idx + 1] += bullets[idx + 3];
                bullets[idx + 2] += bullets[idx + 4];
                if (bullets[idx + 1] < 0 || bullets[idx + 1] > canvas.width || bullets[idx + 2] < 0 || bullets[idx + 2] > canvas.height) {
                    bullets[idx] = 0; 
                }
            }
        }

        for (let i = 0; i < MAX_ENEMIES; i++) {
            let eIdx = i * 4;
            if (enemies[eIdx] === 1) {
                let dx = player.x - enemies[eIdx + 1];
                let dy = player.y - enemies[eIdx + 2];
                let absX = dx < 0 ? -dx : dx;
                let absY = dy < 0 ? -dy : dy;
                let total = absX + absY;

                if (total > 0) {
                    enemies[eIdx + 1] += (dx / total) * enemies[eIdx + 3];
